# Test the scripts that this repository's shared workflows run.
name: Test shared scripts

on:
  pull_request:
  push:
    branches: [main]
    paths: [scripts/**, actions/**, templates/**, .github/workflows/test.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test scripts/repo-shape.test.mjs
      - run: node --test templates/project-page/test.mjs
      - run: bash actions/publish-preview/test.sh
